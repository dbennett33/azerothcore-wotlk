name: deploy-vps

# Promote /home/acore/server-staging (last vps-build on this host) to live.
# Does not compile — run vps-build first (automatic on push to Playerbot).

on:
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

permissions:
  contents: read

env:
  ACORE_PREFIX: /home/acore/server
  ACORE_STAGING: /home/acore/server-staging
  CC: gcc
  CXX: g++

jobs:
  deploy:
    runs-on: [self-hosted, linux, acore-vps]
    name: promote-and-restart
    steps:
      - name: Checkout deploy scripts
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            apps/deploy
            apps/startup-scripts
          sparse-checkout-cone-mode: false

      - name: User systemd environment
        run: echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"

      - name: Verify staged binaries
        run: |
          if [ ! -x "${ACORE_STAGING}/bin/worldserver" ] || [ ! -x "${ACORE_STAGING}/bin/authserver" ]; then
            echo "Missing staged binaries under ${ACORE_STAGING}."
            echo "Push/merge to Playerbot and wait for vps-build to finish on this host."
            exit 1
          fi
          if [ -f "${ACORE_STAGING}/.build-info" ]; then
            cat "${ACORE_STAGING}/.build-info"
          fi

      - name: Install deploy helpers on host
        run: |
          install -D -m 755 apps/deploy/debian12/restart-acore.sh /home/acore/deploy/restart-acore.sh
          install -D -m 755 apps/deploy/debian12/setup-systemd-units.sh /home/acore/deploy/setup-systemd-units.sh
          install -D -m 755 apps/deploy/debian12/configure-vanilla-progression.sh /home/acore/deploy/configure-vanilla-progression.sh
          install -D -m 755 apps/deploy/debian12/apply-vanilla-optional.sh /home/acore/deploy/apply-vanilla-optional.sh
          install -D -m 755 apps/deploy/debian12/backup-acore.sh /home/acore/deploy/backup-acore.sh
          install -D -m 755 apps/deploy/debian12/restore-acore.sh /home/acore/deploy/restore-acore.sh
          install -D -m 644 apps/deploy/debian12/.acore-backup.env.example /home/acore/deploy/.acore-backup.env.example
          mkdir -p /home/acore/src/azerothcore/apps
          rsync -a apps/startup-scripts/ /home/acore/src/azerothcore/apps/startup-scripts/
          rsync -a apps/deploy/ /home/acore/src/azerothcore/apps/deploy/

      - name: Clone mod-individual-progression for optional SQL/DBC
        run: |
          set -euo pipefail
          dest=/home/acore/src/mod-individual-progression
          if [[ ! -d "$dest/.git" ]]; then
            git clone --depth 1 https://github.com/ZhengPeiRu21/mod-individual-progression.git "$dest"
          else
            git -C "$dest" fetch --depth 1 origin master
            git -C "$dest" checkout -f master
            git -C "$dest" pull --ff-only origin master
          fi

      - name: Apply optional vanilla SQL and DBC (once)
        run: |
          set -euo pipefail
          export ACORE_PREFIX="${ACORE_PREFIX}"
          export MOD_IP_ROOT=/home/acore/src/mod-individual-progression
          /home/acore/deploy/apply-vanilla-optional.sh || true

      - name: Stop live services
        run: /home/acore/deploy/restart-acore.sh stop

      - name: Swap bin directory
        run: |
          set -euo pipefail
          mkdir -p "${ACORE_PREFIX}"
          staging_bin="${ACORE_STAGING}/bin"
          live_bin="${ACORE_PREFIX}/bin"
          new_bin="${ACORE_PREFIX}/bin.new"
          old_bin="${ACORE_PREFIX}/bin.old"
          rm -rf "${new_bin}"
          mkdir -p "${new_bin}"
          rsync -a --delete "${staging_bin}/" "${new_bin}/"
          if [ -d "${live_bin}" ]; then
            rm -rf "${old_bin}"
            mv "${live_bin}" "${old_bin}"
          fi
          mv "${new_bin}" "${live_bin}"
          if [ -d "${ACORE_STAGING}/etc" ]; then
            mkdir -p "${ACORE_PREFIX}/etc"
            rsync -a --ignore-existing "${ACORE_STAGING}/etc/" "${ACORE_PREFIX}/etc/"
          fi

      - name: Configure vanilla progression settings
        run: |
          export ACORE_PREFIX="${ACORE_PREFIX}"
          /home/acore/deploy/configure-vanilla-progression.sh

      - name: Start live services
        run: /home/acore/deploy/restart-acore.sh start
