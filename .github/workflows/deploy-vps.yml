name: deploy-vps

# Promote the last vps-build output from server-staging to the live server prefix.
# Does not compile — run vps-build first (automatic on push to Playerbot).

on:
  workflow_dispatch:
    inputs:
      git_sha:
        description: Deploy binaries built for this commit (empty = whatever is in server-staging now)
        required: false
        default: ""

concurrency:
  group: deploy-vps
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  ACORE_PREFIX: /home/acore/server
  ACORE_STAGING: /home/acore/server-staging
  CC: gcc
  CXX: g++

jobs:
  deploy:
    runs-on: [self-hosted, linux, acore-vps]
    name: promote-and-restart
    steps:
      - name: Checkout deploy scripts
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            apps/deploy
            apps/startup-scripts
          sparse-checkout-cone-mode: false

      - name: User systemd environment
        run: echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"

      - name: Restore staging from artifact
        if: inputs.git_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          name="acore-staging-${{ inputs.git_sha }}"
          run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts" \
            --paginate -q ".artifacts[] | select(.name==\"${name}\" and .expired==false) | .id" | head -1)"
          if [ -z "$run_id" ]; then
            echo "No artifact named ${name}. Wait for vps-build on that commit or leave git_sha empty."
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${run_id}/zip" > "${RUNNER_TEMP}/staging.zip"
          rm -rf "${ACORE_STAGING}"
          mkdir -p "${ACORE_STAGING}"
          unzip -q "${RUNNER_TEMP}/staging.zip" -d "${ACORE_STAGING}"

      - name: Verify staged binaries
        run: |
          if [ ! -x "${ACORE_STAGING}/bin/worldserver" ] || [ ! -x "${ACORE_STAGING}/bin/authserver" ]; then
            echo "Missing staged binaries under ${ACORE_STAGING}."
            echo "Push/merge to Playerbot and wait for vps-build, or set git_sha to a built commit."
            exit 1
          fi
          if [ -f "${ACORE_STAGING}/.build-info" ]; then
            cat "${ACORE_STAGING}/.build-info"
          fi

      - name: Install deploy helpers on host
        run: |
          install -D -m 755 apps/deploy/debian12/restart-acore.sh /home/acore/deploy/restart-acore.sh
          install -D -m 755 apps/deploy/debian12/setup-systemd-units.sh /home/acore/deploy/setup-systemd-units.sh
          mkdir -p /home/acore/src/azerothcore/apps
          rsync -a apps/startup-scripts/ /home/acore/src/azerothcore/apps/startup-scripts/
          rsync -a apps/deploy/ /home/acore/src/azerothcore/apps/deploy/

      - name: Stop live services
        run: /home/acore/deploy/restart-acore.sh stop

      - name: Swap bin directory
        run: |
          set -euo pipefail
          mkdir -p "${ACORE_PREFIX}"
          staging_bin="${ACORE_STAGING}/bin"
          live_bin="${ACORE_PREFIX}/bin"
          new_bin="${ACORE_PREFIX}/bin.new"
          old_bin="${ACORE_PREFIX}/bin.old"
          rm -rf "${new_bin}"
          mkdir -p "${new_bin}"
          rsync -a --delete "${staging_bin}/" "${new_bin}/"
          if [ -d "${live_bin}" ]; then
            rm -rf "${old_bin}"
            mv "${live_bin}" "${old_bin}"
          fi
          mv "${new_bin}" "${live_bin}"
          if [ -d "${ACORE_STAGING}/etc" ]; then
            mkdir -p "${ACORE_PREFIX}/etc"
            rsync -a --ignore-existing "${ACORE_STAGING}/etc/" "${ACORE_PREFIX}/etc/"
          fi

      - name: Start live services
        run: /home/acore/deploy/restart-acore.sh start
