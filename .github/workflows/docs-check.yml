name: docs-check
on:
  pull_request:
    branches:
      - dev
      - Playerbot
    paths:
      - "docs/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - ".agents/**"
      - ".claude/**"
      - ".cursor/**"
      - ".github/copilot-instructions.md"
      - ".github/agents/**"
      - "apps/deploy/README.md"
      - "client-patches/README.md"
      - "apps/codestyle/codestyle-docs.py"
      - ".github/workflows/docs-check.yml"
  push:
    branches:
      - dev
    paths:
      - "docs/**"
      - "AGENTS.md"
      - ".agents/**"
      - ".claude/**"
      - ".cursor/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs-index:
    name: Fork docs index and agent entry points
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check index, routing, symlinks, rules, links
        run: python3 apps/codestyle/codestyle-docs.py
